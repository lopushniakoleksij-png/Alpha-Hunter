name: Successor Atomic Snapshot Disposable PG16-17 Research CI
on:
  pull_request:
    paths:
      - 'research/successor_atomic_snapshot_v01.sql'
      - 'tests/postgres/successor_atomic_snapshot_pg_integration_v01.sql'
      - 'tests/postgres/successor_atomic_snapshot_timeout_57014_v01.sh'
      - 'tests/postgres/successor_atomic_snapshot_concurrency_v01.sh'
      - '.github/workflows/successor-atomic-snapshot-pg-research-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disposable-postgres-rollback:
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '17']
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: research
          POSTGRES_PASSWORD: local-only-not-secret
          POSTGRES_DB: isolated_research
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U research -d isolated_research"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: research
      PGPASSWORD: local-only-not-secret
      PGDATABASE: isolated_research
      BITGET_API_KEY: ''
      BITGET_SECRET_KEY: ''
      SUPABASE_URL: ''
      SUPABASE_SERVICE_ROLE_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - name: Install local PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Exercise real PG transaction rollback with synthetic data
        run: psql -X -v ON_ERROR_STOP=1 -f tests/postgres/successor_atomic_snapshot_pg_integration_v01.sql
      - name: Verify SQLSTATE 57014 cancellation and full rollback
        run: bash tests/postgres/successor_atomic_snapshot_timeout_57014_v01.sh
      - name: Verify concurrent duplicate-run lock contention and atomicity
        run: bash tests/postgres/successor_atomic_snapshot_concurrency_v01.sh
