name: P0.2 full-width 6-writer PostgREST p99 WAL locks and fault recovery PG16 PG17
on:
  pull_request:
    paths:
      - 'ops/reviews/phase2_fullwidth_mixed_stress_and_faults_v01.py'
      - 'ops/reviews/phase2_real_catalog_http_concurrency_benchmark_v01.py'
      - 'tests/fixtures/p0_production_catalog_trigger_chain_20261102.sql'
      - 'tests/fixtures/p0_catalog_parent_ledger_protection_addendum_20261102.sql'
      - '.github/workflows/p0-fullwidth-p99-wal-locks-faults-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fullwidth-p0-2:
    strategy:
      fail-fast: false
      matrix:
        pg: ['16','17']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 14
      postgrest:
        image: postgrest/postgrest:v12.2.8
        env:
          PGRST_DB_URI: 'postgres://postgres:isolated-only@postgres:5432/postgres'
          PGRST_DB_SCHEMAS: 'public'
          PGRST_DB_ANON_ROLE: 'postgres'
          PGRST_SERVER_PORT: 3000
          PGRST_DB_POOL: 12
        ports:
          - 3000:3000
    env:
      AH_P0_ISOLATED_ONLY: '1'
      AH_P0_STRESS_EXPLICIT: '1'
      AH_P0_HISTORY_ROWS: '1640424'
      AH_P0_PARENT_LEDGER_COMPLETE: '1'
      SUPABASE_URL: ''
      SUPABASE_SERVICE_ROLE_KEY: ''
      BITGET_API_KEY: ''
      BITGET_SECRET_KEY: ''
      RENDER_API_KEY: ''
      BITGET_API_PASSPHRASE: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Local PostgreSQL client and strictly isolated Python dependencies
        run: |
          command -v psql || (sudo apt-get update -qq && sudo apt-get install -qq -y postgresql-client)
          python -m pip install --disable-pip-version-check 'psycopg[binary]>=3.2,<3.4' requests
      - name: Full-size 3.8 GB seed then six-client p99 WAL lock and transport failure matrix
        run: python ops/reviews/phase2_fullwidth_mixed_stress_and_faults_v01.py
      - name: Upload machine-readable inspectable P0.2 evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: p0-2-fullwidth-pg${{ matrix.pg }}-p99-wal-locks-57014-ack
          path: catalog_chain_http_results/stress_p0_2_report.json
          retention-days: 7
          if-no-files-found: error
      - name: Confirm protected systems and secrets were never connected
        run: |
          test -z "$SUPABASE_URL"
          test -z "$SUPABASE_SERVICE_ROLE_KEY"
          test -z "$BITGET_API_KEY"
          test -z "$BITGET_SECRET_KEY"
          test -z "$RENDER_API_KEY"
