name: Traceability Repair CI

on:
  pull_request:
    paths:
      - "alpha_hunter/traceability.py"
      - "traceability_job.py"
      - "hourly_production.py"
      - "tests/test_traceability.py"
      - ".github/workflows/traceability-ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile repaired modules
        run: |
          python -m py_compile alpha_hunter/traceability.py traceability_job.py hourly_production.py
      - name: Run traceability tests
        run: pytest -q tests/test_traceability.py
