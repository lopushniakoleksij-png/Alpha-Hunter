name: P0 security RLS isolated role matrix PG16 PG17
on:
  pull_request:
    paths:
      - 'tests/test_phase2_isolated_rls_role_semantics_20261102.py'
      - '.github/workflows/p0-security-rls-role-matrix-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        pg: ['16','17']
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      AH_LOCAL_RLS_ONLY: '1'
      AH_ISOLATED_RLS_PG_DSN: 'host=127.0.0.1 port=5432 dbname=postgres user=postgres password=isolated-only'
      SUPABASE_URL: ''
      SUPABASE_SERVICE_ROLE_KEY: ''
      BITGET_API_KEY: ''
      BITGET_SECRET_KEY: ''
      RENDER_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated pytest and psycopg only
        run: python -m pip install --disable-pip-version-check pytest 'psycopg[binary]>=3.2,<3.4'
      - name: Execute real local PG role and RLS policy tests
        run: python -m pytest -q tests/test_phase2_isolated_rls_role_semantics_20261102.py
      - name: Confirm all production credentials absent
        run: |
          test -z "$SUPABASE_URL"
          test -z "$SUPABASE_SERVICE_ROLE_KEY"
          test -z "$BITGET_API_KEY"
          test -z "$RENDER_API_KEY"
