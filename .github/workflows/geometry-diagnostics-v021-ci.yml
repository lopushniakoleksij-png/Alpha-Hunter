name: Geometry Diagnostics v0.2.1 CI

on:
  pull_request:
    paths:
      - 'geometry_diagnostics_v021_fix.sql'
      - 'tests/test_geometry_diagnostics_v021_fix.py'
      - '.github/workflows/geometry-diagnostics-v021-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'geometry_diagnostics_v021_fix.sql'
      - 'tests/test_geometry_diagnostics_v021_fix.py'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest requests
      - name: Run corrective geometry and safety tests
        run: >-
          python -m pytest -q
          tests/test_geometry_diagnostics_v021_fix.py
          tests/test_geometry_diagnostics_v02.py
          tests/test_geometry_diagnostics_v01.py
          tests/test_production_gates_v03.py
          tests/test_money_entry_stage_position_conflict_binding_v01.py
