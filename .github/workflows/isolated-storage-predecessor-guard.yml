name: Isolated storage predecessor guard

on:
  push:
    branches:
      - research/guard-incomplete-predecessor-20261106

permissions:
  contents: read

jobs:
  synthetic-storage-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install minimal test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.4.2
      - name: Syntax verification
        run: python -m compileall -q alpha_hunter/storage.py tests/test_storage.py
      - name: Local synthetic storage tests only
        env:
          SUPABASE_URL: ''
          SUPABASE_SERVICE_ROLE_KEY: ''
          BITGET_API_KEY: ''
          BITGET_API_SECRET: ''
        run: python -m pytest -q tests/test_storage.py
