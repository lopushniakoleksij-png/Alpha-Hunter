name: Money Entry Stage Position Conflict Binding CI

on:
  pull_request:
    paths:
      - 'money_entry_stage_position_conflict_binding_v01.sql'
      - 'alpha_hunter/account_ledger.py'
      - 'tests/test_money_entry_stage_position_conflict_binding_v01.py'
      - '.github/workflows/money-entry-stage-position-conflict-binding-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'money_entry_stage_position_conflict_binding_v01.sql'
      - 'alpha_hunter/account_ledger.py'
      - 'tests/test_money_entry_stage_position_conflict_binding_v01.py'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest requests
      - name: Run position-conflict and production safety tests
        run: >-
          python -m pytest -q
          tests/test_money_entry_stage_position_conflict_binding_v01.py
          tests/test_canonical_account_ledger.py
          tests/test_money_entry_stage_writer_universe_liquidity_integration_v01.py
          tests/test_production_gates_v03.py
