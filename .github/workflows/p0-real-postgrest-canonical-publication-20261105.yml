name: P0 real HTTP PostgREST canonical publication 16 17 (isolated)
on:
  pull_request:
    branches:
      - research/p0-atomic-rpc-lost-ack-20261105-0544
      - research/p0-production-schema-atomic-review-20261105
    paths:
      - 'ops/reviews/p0_real_postgrest_canonical_publication_20261105.py'
      - 'ops/reviews/p0_verify_isolated_production_catalog_clone_20261105.py'
      - 'ops/reviews/test_p0_clone_dsn_guard_20261105.py'
      - 'ops/reviews/p0_private_clone_actual_trigger_benchmark_20261105.py'
      - 'ops/reviews/test_p0_private_clone_guard_20261105.py'
      - 'ops/reviews/p0_readonly_production_fingerprints_20261105.json'
      - 'ops/reviews/p0_production_trigger_dependency_candidates_20261105.json'
      - 'ops/reviews/p0_cross_schema_write_candidate_graph_20261105.json'
      - 'ops/reviews/P0_ISOLATED_BENCHMARK_AND_TRIGGER_GRAPH_20261105.md'
      - 'ops/reviews/P0_INDEPENDENT_DBA_SECURITY_ACCEPTANCE_PACKET_20261105.md'
      - 'ops/reviews/P0_PRIVATE_EXACT_CLONE_DBA_HANDOFF_20261105.md'
      - 'research/p0_successor_atomic_canonical_v03_PRODUCTION_SCHEMA_REVIEW_ONLY.sql'
      - '.github/workflows/p0-real-postgrest-canonical-publication-20261105.yml'
  push:
    branches:
      - research/p0-bounded-child-write-exit-safety-20261105
      - research/p0-atomic-rpc-lost-ack-20261105-0544
      - research/p0-production-schema-atomic-review-20261105
      - research/p0-clone-dsn-strict-20261105-1142
    paths:
      - 'ops/reviews/p0_real_postgrest_canonical_publication_20261105.py'
      - 'ops/reviews/p0_verify_isolated_production_catalog_clone_20261105.py'
      - 'ops/reviews/test_p0_clone_dsn_guard_20261105.py'
      - 'ops/reviews/p0_private_clone_actual_trigger_benchmark_20261105.py'
      - 'ops/reviews/test_p0_private_clone_guard_20261105.py'
      - 'ops/reviews/p0_readonly_production_fingerprints_20261105.json'
      - 'ops/reviews/p0_production_trigger_dependency_candidates_20261105.json'
      - 'ops/reviews/p0_cross_schema_write_candidate_graph_20261105.json'
      - 'ops/reviews/P0_ISOLATED_BENCHMARK_AND_TRIGGER_GRAPH_20261105.md'
      - 'ops/reviews/P0_INDEPENDENT_DBA_SECURITY_ACCEPTANCE_PACKET_20261105.md'
      - 'ops/reviews/P0_PRIVATE_EXACT_CLONE_DBA_HANDOFF_20261105.md'
      - 'research/p0_successor_atomic_canonical_v02_DISPOSABLE_ONLY.sql'
      - 'research/p0_successor_atomic_canonical_v03_PRODUCTION_SCHEMA_REVIEW_ONLY.sql'
      - '.github/workflows/p0-real-postgrest-canonical-publication-20261105.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-local-http:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '17']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated_only
          POSTGRES_DB: isolated_research
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d isolated_research"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      postgrest:
        image: postgrest/postgrest:v12.2.8
        env:
          PGRST_DB_URI: "postgres://postgres:isolated_only@postgres:5432/isolated_research"
          PGRST_DB_SCHEMAS: "public"
          PGRST_DB_ANON_ROLE: "ah_p0_local_writer"
          PGRST_SERVER_PORT: 3000
          PGRST_DB_POOL: 10
        ports:
          - 3000:3000
      postgrest_roles:
        image: postgrest/postgrest:v12.2.8
        env:
          PGRST_DB_URI: "postgres://postgres:isolated_only@postgres:5432/isolated_research"
          PGRST_DB_SCHEMAS: "public"
          PGRST_DB_ANON_ROLE: "anon"
          PGRST_JWT_SECRET: "alpha-hunter-disposable-only-role-matrix-2026-key"
          PGRST_SERVER_PORT: 3000
          PGRST_DB_POOL: 5
        ports:
          - 3001:3000
    env:
      AH_P0_LOCAL_POSTGREST_ONLY: '1'
      AH_P0_PG_DSN: 'host=127.0.0.1 port=5432 dbname=isolated_research user=postgres password=isolated_only'
      SUPABASE_URL: ''
      SUPABASE_SERVICE_ROLE_KEY: ''
      BITGET_API_KEY: ''
      BITGET_SECRET_KEY: ''
      RENDER_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned app dependencies and isolated PostgreSQL driver
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check 'psycopg[binary]==3.3.8'
      - name: Compile read-only DBA clone fingerprint verifier (not an acceptance run)
        run: python -m py_compile ops/reviews/p0_verify_isolated_production_catalog_clone_20261105.py
      - name: Test isolated clone connection guard (no database connection)
        run: python -m unittest discover -s ops/reviews -p 'test_p0_clone_dsn_guard_20261105.py' -v
      - name: No-network private DBA benchmark guard tests (NOT acceptance)
        run: |
          python -m py_compile ops/reviews/p0_private_clone_actual_trigger_benchmark_20261105.py
          python -m unittest discover -s ops/reviews -p 'test_p0_private_clone_guard_20261105.py' -v
      - name: Validate pinned production catalog and candidate-graph metadata (no source bodies)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("ops/reviews")
          first = json.loads((p / "p0_readonly_production_fingerprints_20261105.json").read_text())
          graph = json.loads((p / "p0_production_trigger_dependency_candidates_20261105.json").read_text())
          cross = json.loads((p / "p0_cross_schema_write_candidate_graph_20261105.json").read_text())
          assert len(first["canonical_tables"]) == 5
          assert len(first["first_order_triggers"]) == 7
          assert len(graph["relations"]) == 22
          assert len(graph["trigger_metadata"]) == 31
          assert len(graph["lexical_candidate_edges"]) == 26
          assert len(cross["relations"]) == 20
          assert sum(x["qualified_name"].startswith("private.") for x in cross["relations"]) == 6
          assert len(cross["reachable_hooks"]) == 21
          assert len(cross["reachable_write_candidates"]) == 15
          assert any(x["qualified_name"] == "private.alpha_hunter_paper_orders_v01" for x in cross["relations"])
          assert cross["verdict"].endswith("PRODUCTION NO-GO")
          assert graph["release_decision"] == "PRODUCTION NO-GO"
          assert any("calibrated_paper_order" in x["trigger"] for x in graph["trigger_metadata"])
          print("PASS metadata integrity only, not exact production clone")
          PY
      - name: Actual HTTP canonical parent-child-signal-feature-readiness fault matrix
        run: PYTHONPATH=. python ops/reviews/p0_real_postgrest_canonical_publication_20261105.py
      - name: Synthetic PG17 fixture MUST fail the exact-production clone gate
        if: matrix.postgres == '17'
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          result = subprocess.run(
              [sys.executable, "ops/reviews/p0_verify_isolated_production_catalog_clone_20261105.py"],
              capture_output=True, text=True, check=False, timeout=30,
          )
          assert result.returncode == 2, (
              "DANGER: simplified synthetic schema was wrongly accepted as production clone",
              result.returncode, result.stdout[-500:], result.stderr[-500:],
          )
          try:
              report = json.loads(result.stdout.strip().splitlines()[-1])
          except Exception as exc:
              raise AssertionError("Clone rejection did not yield inspectable JSON") from exc
          assert report["status"] == "CATALOG_MISMATCH_NO_GO", report
          assert report["release_decision"] == "PRODUCTION NO-GO"
          assert report["transitive_production_graph_verified"] is False
          assert report["independent_DBA_security_approval"] is False
          assert len(report["issues"]) > 0
          print("PASS negative gate: synthetic PG17 schema rejected; production release remains NO-GO")
          PY
      - name: Archive isolated-only HTTP publication evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: p0-real-postgrest-${{ matrix.postgres }}-evidence
          path: p0_postgrest_acceptance_results/report.json
          retention-days: 7
          if-no-files-found: error
      - name: Require no production service keys
        if: always()
        run: |
          test -z "$SUPABASE_URL"
          test -z "$SUPABASE_SERVICE_ROLE_KEY"
          test -z "$BITGET_API_KEY"
          test -z "$BITGET_SECRET_KEY"
          test -z "$RENDER_API_KEY"
