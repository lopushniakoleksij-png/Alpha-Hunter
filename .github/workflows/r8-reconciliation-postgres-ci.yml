name: R8 Reconciliation PostgreSQL Contract
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  postgres-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated PostgreSQL behavior tests
        working-directory: tests/postgres
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
