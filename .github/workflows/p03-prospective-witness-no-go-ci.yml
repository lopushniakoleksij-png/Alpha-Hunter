name: P0 isolated prospective dual-witness admission contract

on:
  push:
    branches:
      - research/p03-prospective-evidence-admission-20261103
  pull_request:
    paths:
      - 'ops/reviews/p03_prospective_dual_witness_chain_v01.py'
      - 'tests/test_p03_prospective_dual_witness_chain_v01.py'
      - '.github/workflows/p03-prospective-witness-no-go-ci.yml'

permissions:
  contents: read

jobs:
  prospective-evidence-no-go:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_URL: ''
      SUPABASE_SERVICE_ROLE_KEY: ''
      BITGET_API_KEY: ''
      BITGET_SECRET_KEY: ''
      BITGET_API_PASSPHRASE: ''
      RENDER_API_KEY: ''
      TRADING_ENABLED: 'false'
      PAPER_ONLY: 'true'
      ORDER_PATH: 'NONE'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated signature verifier only
        run: python -m pip install --disable-pip-version-check 'cryptography==46.0.4'
      - name: Compile forward-only research contract
        run: python -m py_compile ops/reviews/p03_prospective_dual_witness_chain_v01.py
      - name: Test signed schedule, exact receipts and no retroactive history promotion
        run: python -m unittest discover -s tests -p 'test_p03_prospective_dual_witness_chain_v01.py' -v
      - name: No production credentials, trade authority or deployment
        run: |
          test -z "$SUPABASE_URL"
          test -z "$SUPABASE_SERVICE_ROLE_KEY"
          test -z "$BITGET_API_KEY"
          test -z "$RENDER_API_KEY"
          test "$TRADING_ENABLED" = "false"
          test "$PAPER_ONLY" = "true"
          test "$ORDER_PATH" = "NONE"
          echo 'FORWARD_ONLY_RESEARCH_CONTRACT_NOT_INDEPENDENT_PROVIDER_PROOF'
