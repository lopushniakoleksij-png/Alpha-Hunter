name: Phase II successor evidence gate - isolated contracts
on:
  pull_request:
    paths:
      - 'ops/reviews/phase2_successor_integrity_gate_v01.py'
      - 'tests/test_phase2_successor_integrity_gate_v01.py'
      - '.github/workflows/phase2-successor-integrity-contract-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BITGET_API_KEY: ''
      BITGET_SECRET_KEY: ''
      SUPABASE_URL: ''
      SUPABASE_SERVICE_ROLE_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline fail-closed successor acceptance contracts
        run: python -m unittest discover -s tests -p 'test_phase2_successor_integrity_gate_v01.py' -v
