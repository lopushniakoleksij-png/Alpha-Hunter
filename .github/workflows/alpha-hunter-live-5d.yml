name: Alpha Hunter Current-Main Evidence Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/alpha-hunter-live-5d.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha-hunter-current-main-evidence-validation
  cancel-in-progress: false

jobs:
  evidence-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONPATH: .
      ALPHA_HUNTER_VALIDATION_MODE: evidence_only
      ALPHA_HUNTER_TRADE_PERMISSION: "false"
      ALPHA_HUNTER_RESEARCH_SHADOW_TRADE_PERMISSION: "false"

    steps:
      - name: Checkout current main without push credentials
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Verify tests on current main
        run: python -m pytest -q tests

      - name: Run evidence-only current-main chain
        id: evidence
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -u

          RUN_ID="current-main-evidence-$(date -u +%Y%m%dT%H%M%SZ)"
          BASE="data/current-main-evidence/$RUN_ID"
          LOGDIR="$BASE/logs"
          STATUS="$BASE/status.tsv"
          SUMMARY="$BASE/summary.txt"

          mkdir -p "$LOGDIR" "$BASE/raw" "$BASE/deep-snapshots"
          printf "step\tstatus\n" > "$STATUS"

          export ALPHA_HUNTER_PRODUCTION_RUN_ID="$RUN_ID"
          export ALPHA_HUNTER_PRODUCTION_VERSION="current-main-evidence-v1"

          run_one () {
            LABEL="$1"
            SCRIPT="$2"
            LIMIT="${3:-12m}"

            timeout "$LIMIT" python "$SCRIPT" > >(tee "$LOGDIR/$LABEL.log") 2>&1
            CODE=$?

            if [ "$CODE" -eq 0 ]; then
              printf "%s\tPASS\n" "$LABEL" >> "$STATUS"
            else
              printf "%s\tFAIL_%s\n" "$LABEL" "$CODE" >> "$STATUS"
            fi

            return "$CODE"
          }

          skip_one () {
            printf "%s\tSKIPPED_%s\n" "$1" "$2" >> "$STATUS"
          }

          python - <<'PY' > >(tee "$LOGDIR/raw_universe.log") 2>&1
          import gzip
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          from alpha_hunter.bitget import BitgetClient
          from alpha_hunter.collector import load_config

          config = load_config(Path("config.json"))
          product_type = str(config.get("product_type", "usdt-futures"))
          client = BitgetClient.from_environment(
              timeout=int(config.get("request_timeout_seconds", 12)),
              max_retries=int(config.get("max_retries", 3)),
          )
          payload = {
              "run_id": os.environ["ALPHA_HUNTER_PRODUCTION_RUN_ID"],
              "captured_at_utc": datetime.now(timezone.utc).isoformat(),
              "product_type": product_type,
              "contracts": client.contracts(product_type) or [],
              "instruments": client.instruments(product_type) or [],
              "tickers": client.tickers(product_type) or [],
              "trade_permission": False,
              "research_shadow_trade_permission": False,
              "source": "BITGET_PUBLIC_API",
          }
          path = Path("data/current-main-evidence") / payload["run_id"] / "raw" / "universe.json.gz"
          path.parent.mkdir(parents=True, exist_ok=True)
          with gzip.open(path, "wt", encoding="utf-8") as handle:
              json.dump(payload, handle, separators=(",", ":"))
          print(f"raw_universe_path={path}")
          print(f"contracts={len(payload['contracts'])}")
          print(f"instruments={len(payload['instruments'])}")
          print(f"tickers={len(payload['tickers'])}")
          PY
          RAW_CODE=$?

          if [ "$RAW_CODE" -eq 0 ]; then
            printf "raw_universe\tPASS\n" >> "$STATUS"
          else
            printf "raw_universe\tFAIL_%s\n" "$RAW_CODE" >> "$STATUS"
          fi

          run_one live_scan run.py 15m
          LIVE_CODE=$?

          if [ -f data/snapshots/latest.json ]; then
            gzip -9 -c data/snapshots/latest.json > "$BASE/deep-snapshots/latest.json.gz"
          fi

          if [ "$LIVE_CODE" -ne 0 ]; then
            skip_one v79_universe LIVE_SCAN_FAILED
            skip_one guardrails LIVE_SCAN_FAILED
            skip_one v74_tracking LIVE_SCAN_FAILED
            skip_one v75_lifecycle LIVE_SCAN_FAILED
            skip_one v75_market_tracker LIVE_SCAN_FAILED
            skip_one v75_finalizer LIVE_SCAN_FAILED
            skip_one v76_direction LIVE_SCAN_FAILED
            skip_one v76_post_confirmation LIVE_SCAN_FAILED
            skip_one v77_execution LIVE_SCAN_FAILED
            skip_one v79_missed_mover LIVE_SCAN_FAILED
          elif [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            skip_one v79_universe SUPABASE_NOT_CONFIGURED
            skip_one guardrails SUPABASE_NOT_CONFIGURED
            skip_one v74_tracking SUPABASE_NOT_CONFIGURED
            skip_one v75_lifecycle SUPABASE_NOT_CONFIGURED
            skip_one v75_market_tracker SUPABASE_NOT_CONFIGURED
            skip_one v75_finalizer SUPABASE_NOT_CONFIGURED
            skip_one v76_direction SUPABASE_NOT_CONFIGURED
            skip_one v76_post_confirmation SUPABASE_NOT_CONFIGURED
            skip_one v77_execution SUPABASE_NOT_CONFIGURED
            skip_one v79_missed_mover SUPABASE_NOT_CONFIGURED
          else
            run_one v79_universe v79_universe_hourly_collector.py 8m
            LEDGER_CODE=$?

            if [ "$LEDGER_CODE" -ne 0 ]; then
              skip_one guardrails UNIVERSE_LEDGER_FAILED
              skip_one v74_tracking DATA_GATE_FAILED
              skip_one v75_lifecycle DATA_GATE_FAILED
              skip_one v75_market_tracker DATA_GATE_FAILED
              skip_one v75_finalizer DATA_GATE_FAILED
              skip_one v76_direction DATA_GATE_FAILED
              skip_one v76_post_confirmation DATA_GATE_FAILED
              skip_one v77_execution DATA_GATE_FAILED
            else
              run_one guardrails production_guardrails.py 8m
              GUARD_CODE=$?

              if [ "$GUARD_CODE" -ne 0 ]; then
                skip_one v74_tracking GUARDRAIL_FAILED
                skip_one v75_lifecycle GUARDRAIL_FAILED
                skip_one v75_market_tracker GUARDRAIL_FAILED
                skip_one v75_finalizer GUARDRAIL_FAILED
                skip_one v76_direction GUARDRAIL_FAILED
                skip_one v76_post_confirmation GUARDRAIL_FAILED
                skip_one v77_execution GUARDRAIL_FAILED
              else
                CHAIN_OK=1
                for ENTRY in \
                  "v74_tracking:v74_tracking_job.py:8m" \
                  "v75_lifecycle:v75_lifecycle_job.py:8m" \
                  "v75_market_tracker:v75_episode_market_tracker.py:10m" \
                  "v75_finalizer:v75_episode_finalizer.py:8m" \
                  "v76_direction:v76_direction_shadow.py:10m" \
                  "v76_post_confirmation:v76_post_confirmation_tracker.py:10m" \
                  "v77_execution:v77_execution_feasibility_shadow.py:10m"
                do
                  IFS=: read -r LABEL SCRIPT LIMIT <<< "$ENTRY"
                  if [ "$CHAIN_OK" -eq 1 ]; then
                    run_one "$LABEL" "$SCRIPT" "$LIMIT"
                    CODE=$?
                    if [ "$CODE" -ne 0 ]; then
                      CHAIN_OK=0
                    fi
                  else
                    skip_one "$LABEL" UPSTREAM_MODEL_FAILED
                  fi
                done
              fi
            fi

            run_one v79_missed_mover v79_missed_mover_recall_auditor.py 10m
          fi

          {
            echo "run_id=$RUN_ID"
            echo "validated_ref=main"
            echo "validation_mode=evidence_only"
            echo "trade_permission=false"
            echo "research_shadow_trade_permission=false"
            echo "repository_push=disabled"
            echo "production_runner=not_invoked"
            echo
            cat "$STATUS"
          } | tee "$SUMMARY"

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Upload append-only validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-hunter-current-main-evidence-${{ steps.evidence.outputs.run_id }}
          path: data/current-main-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce evidence gate
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          status_files = list(Path("data/current-main-evidence").glob("*/status.tsv"))
          if len(status_files) != 1:
              raise SystemExit(f"expected one status ledger, found {len(status_files)}")

          rows = {}
          for line in status_files[0].read_text(encoding="utf-8").splitlines()[1:]:
              if not line.strip():
                  continue
              step, status = line.split("\t", 1)
              rows[step] = status

          required = ("raw_universe", "live_scan", "v79_universe", "guardrails")
          failures = {step: rows.get(step, "MISSING") for step in required if rows.get(step) != "PASS"}
          chain_failures = {step: status for step, status in rows.items() if status.startswith("FAIL_")}

          if failures or chain_failures:
              print(f"required_gate_failures={failures}")
              print(f"chain_failures={chain_failures}")
              raise SystemExit(1)

          print("CURRENT_MAIN_EVIDENCE_GATE=PASS")
          print("trade_permission=false")
          print("research_shadow_trade_permission=false")
          PY
