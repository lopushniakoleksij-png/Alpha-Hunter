name: Geometry Forward Science View v0.2 CI

on:
  pull_request:
    paths:
      - 'geometry_forward_science_view_v02.sql'
      - 'tests/test_geometry_forward_science_view_v02.py'
      - '.github/workflows/geometry-forward-science-view-v02-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'geometry_forward_science_view_v02.sql'
      - 'tests/test_geometry_forward_science_view_v02.py'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest requests
      - name: Run geometry science and safety tests
        run: >-
          python -m pytest -q
          tests/test_geometry_forward_science_view_v02.py
          tests/test_geometry_scope_alignment_v022.py
          tests/test_participation_forward_science_view_v01.py
          tests/test_participation_diagnostics_v01.py
          tests/test_parent_direction_full_coverage_v02.py
          tests/test_production_gates_v03.py
