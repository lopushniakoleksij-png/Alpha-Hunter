name: P0 Public Bitget Feed Availability (Isolated)
on:
  pull_request:
    paths:
      - '.github/workflows/p0-public-feed-availability-20261016.yml'
permissions:
  contents: read
jobs:
  public-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe official Bitget public USDT-futures v3 ticker freshness (no credentials)
        shell: bash
        run: |
          python - <<'PY'
          import json, time, urllib.request
          url = "https://api.bitget.com/api/v3/market/tickers?category=USDT-FUTURES"
          req = urllib.request.Request(url,headers={"User-Agent":"AlphaHunter-public-readonly-market-check/1.0","Accept":"application/json"})
          try:
              with urllib.request.urlopen(req,timeout=9) as f:
                  assert f.status == 200, "not HTTP 200"
                  data = json.load(f)
              assert data["code"] == "00000"
              ticks = {str(t.get("symbol")):t for t in data.get("data",[]) if isinstance(t,dict)}
              now_ms = round(time.time() * 1000)
              for sym in ("BTCUSDT","ETHUSDT","SOLUSDT","XRPUSDT"):
                  tick = ticks[sym]
                  price = float(tick["lastPrice"])
                  age_ms = now_ms - int(tick["ts"])
                  assert price > 0 and -5000 <= age_ms <= 90000, (sym,age_ms)
                  print(sym, "quote_age_ms", age_ms, "valid=True")
              print("PASS: official Bitget public USDT-futures feed independently available.")
          except Exception as e:
              print("FAIL: official public Bitget feed not independently verified:",repr(e))
              raise
          PY
