name: Partial Candle Participation CI

on:
  pull_request:
    paths:
      - 'alpha_hunter/analysis.py'
      - 'tests/test_analysis.py'
      - '.github/workflows/partial-candle-participation-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'alpha_hunter/analysis.py'
      - 'tests/test_analysis.py'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run analysis and production safety tests
        run: python -m pytest -q tests/test_analysis.py tests/test_production_gates_v03.py
