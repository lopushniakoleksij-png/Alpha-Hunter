name: Full Production Test Suite v0.1

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: full-production-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BITGET_API_KEY: ""
      BITGET_SECRET_KEY: ""
      BITGET_API_PASSPHRASE: ""
      SUPABASE_URL: ""
      SUPABASE_SERVICE_ROLE_KEY: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Install pinned production and test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check pytest pglast==8.4

      - name: Compile production package
        run: |
          python -m compileall -q alpha_hunter
          python -m py_compile             app.py             hourly.py             run.py             test_engine_job.py             traceability_job.py

      - name: Collect complete test suite
        run: python -m pytest --collect-only -q tests

      - name: Run complete test suite
        run: python -m pytest -q tests
