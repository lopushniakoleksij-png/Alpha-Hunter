name: Render Cron Deploy v0.2

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/render-cron-deploy-v01.yml"
      - "tests/test_render_cron_deploy_v01.py"
  push:
    branches:
      - main
    paths:
      - "alpha_hunter/**"
      - "run.py"
      - "hourly.py"
      - "hourly_production.py"
      - "performance_job.py"
      - "feature_job.py"
      - "outcome_job.py"
      - "config.json"
      - "requirements.txt"
      - ".python-version"
      - "ops/runtime_release_fingerprint.py"
      - ".github/workflows/render-cron-deploy-v01.yml"

permissions:
  contents: read

concurrency:
  group: render-cron-deploy-v02
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate cron auto-deployment truth contract
        shell: bash
        run: |
          set -euo pipefail
          workflow=".github/workflows/render-cron-deploy-v01.yml"
          grep -q 'TARGET_SCIENTIFIC_FINGERPRINT' "$workflow"
          grep -q 'TARGET_COMMIT' "$workflow"
          grep -q 'RENDER_CRON' "$workflow"
          grep -q 'canonical cron did not converge' "$workflow"
          grep -q 'commit == target_commit' "$workflow"
          if grep -q 'RENDER_CRON_DEPLOY_HOOK_URL' "$workflow"; then
            echo "::error::Cron service uses Render auto-deploy; redundant deploy-hook dependency is forbidden."
            exit 1
          fi
          forbidden_web_secret='secrets.RENDER''_DEPLOY_HOOK_URL'
          if grep -q "$forbidden_web_secret" "$workflow"; then
            echo "::error::Cron workflow must not reuse the web-service deploy hook."
            exit 1
          fi
          echo "PASS: canonical cron auto-deployment must be proven by post-push runtime evidence."

  verify-auto-deploy:
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TARGET_COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip

      - name: Install pinned production dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate evidence credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}"
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -n "${TARGET_COMMIT:-}"

      - name: Compute target scientific fingerprint
        id: science
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          from alpha_hunter.collector import load_config
          from alpha_hunter.scientific_identity import build_scientific_fingerprint

          root = Path.cwd()
          config = load_config(root / "config.json")
          result = build_scientific_fingerprint(config, root=root)
          print(f"fingerprint={result['sha256']}")
          PY

      - name: Mark verification start
        id: window
        shell: bash
        run: |
          set -euo pipefail
          echo "not_before=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Verify next canonical cron scan converges
        env:
          TARGET_SCIENTIFIC_FINGERPRINT: ${{ steps.science.outputs.fingerprint }}
          NOT_BEFORE_UTC: ${{ steps.window.outputs.not_before }}
        shell: python
        run: |
          import json
          import os
          import time
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          base = os.environ["SUPABASE_URL"].rstrip("/")
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          target = os.environ["TARGET_SCIENTIFIC_FINGERPRINT"]
          target_commit = os.environ["TARGET_COMMIT"]
          not_before = datetime.fromisoformat(
              os.environ["NOT_BEFORE_UTC"].replace("Z", "+00:00")
          ).astimezone(timezone.utc)

          params = urllib.parse.urlencode({
              "select": "run_id,collected_at_utc,payload",
              "payload->validation_identity->>run_source": "eq.RENDER_CRON",
              "order": "collected_at_utc.desc",
              "limit": "1",
          })
          endpoint = base + "/rest/v1/alpha_hunter_snapshots?" + params
          headers = {
              "apikey": key,
              "Authorization": "Bearer " + key,
          }

          last = {}
          for attempt in range(1, 211):
              request = urllib.request.Request(endpoint, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  rows = json.load(response)

              if rows:
                  row = rows[0]
                  identity = (
                      (row.get("payload") or {}).get("validation_identity") or {}
                  )
                  collected_raw = str(row.get("collected_at_utc") or "")
                  fingerprint = str(
                      identity.get("scientific_fingerprint_sha256") or ""
                  )
                  commit = str(identity.get("git_commit") or "")
                  source = str(identity.get("run_source") or "")
                  role = str(identity.get("runtime_role") or "")
                  try:
                      collected = datetime.fromisoformat(
                          collected_raw.replace("Z", "+00:00")
                      ).astimezone(timezone.utc)
                  except ValueError:
                      collected = datetime.min.replace(tzinfo=timezone.utc)

                  last = {
                      "run_id": row.get("run_id"),
                      "collected_at_utc": collected_raw,
                      "git_commit": commit,
                      "run_source": source,
                      "runtime_role": role,
                      "scientific_fingerprint_sha256": fingerprint,
                  }
                  print(
                      f"cron verification {attempt}/210: "
                      f"run={last['run_id']} commit={commit[:12]} "
                      f"fingerprint={fingerprint[:12]}"
                  )
                  if (
                      collected >= not_before
                      and source == "RENDER_CRON"
                      and role == "RENDER_CRON"
                      and commit == target_commit
                      and fingerprint == target
                  ):
                      print(
                          "PASS: Render auto-deployed the exact target commit and "
                          "canonical RENDER_CRON emitted the target science."
                      )
                      raise SystemExit(0)

              time.sleep(20)

          print("Last canonical cron evidence:")
          print(json.dumps(last, sort_keys=True))
          raise SystemExit("canonical cron did not converge to target science and commit")

      - name: Deployment safety summary
        run: |
          echo "PASS: Render cron auto-deployment was verified from canonical runtime evidence."
          echo "PASS: post-push RENDER_CRON scan matched the exact target commit and scientific fingerprint."
          echo "No deploy-hook secret was required."
          echo "No exchange order authority was used."
