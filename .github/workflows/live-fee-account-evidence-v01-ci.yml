name: Live Fee and Account Evidence v0.1 CI

on:
  pull_request:
    branches:
      - live/alpha-hunter-5d-20260816
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest requests
      - name: Compile live scanner modules
        run: python -m compileall -q alpha_hunter
      - name: Run live evidence safety regressions
        run: >-
          python -m pytest -q
          tests/test_live_fee_account_evidence_v01.py
          tests/test_private_account_mode_probe_v01.py
          tests/test_universe_ledger_single_scanner.py
          tests/test_canonical_account_ledger.py
