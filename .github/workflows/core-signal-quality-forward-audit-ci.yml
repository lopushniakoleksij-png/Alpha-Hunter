name: Core Signal Quality Forward Audit CI

on:
  pull_request:
    paths:
      - 'CORE_EXECUTION_SIGNAL_QUALITY_CONTRACT.md'
      - 'money_entry_signal_quality_forward_audit_v01.sql'
      - 'money_entry_signal_quality_fail_closed_v01.sql'
      - 'tests/test_core_signal_quality_forward_audit_v01.py'
      - '.github/workflows/core-signal-quality-forward-audit-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'CORE_EXECUTION_SIGNAL_QUALITY_CONTRACT.md'
      - 'money_entry_signal_quality_forward_audit_v01.sql'
      - 'money_entry_signal_quality_fail_closed_v01.sql'
      - 'tests/test_core_signal_quality_forward_audit_v01.py'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run core signal-quality tests
        run: python -m pytest -q tests/test_core_signal_quality_forward_audit_v01.py tests/test_money_entry_signal_quality_fail_closed_v01.py tests/test_production_gates_v03.py
