name: Readiness Score Compatibility v0.1 CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'readiness_score_compatibility_v01.sql'
      - 'tests/test_readiness_score_compatibility_v01.py'
      - '.github/workflows/readiness-score-compatibility-v01-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'readiness_score_compatibility_v01.sql'
      - 'tests/test_readiness_score_compatibility_v01.py'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run readiness compatibility regressions
        run: >-
          python -m pytest -q
          tests/test_readiness_score_compatibility_v01.py
          tests/test_traceability.py
