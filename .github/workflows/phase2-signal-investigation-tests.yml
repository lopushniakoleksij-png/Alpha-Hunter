name: Phase 2 Signal Investigation Tests
on:
  pull_request:
    paths:
      - 'research/phase2/**'
      - '.github/workflows/phase2-signal-investigation-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phase2-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run pure-function tests without production secrets
        run: python -m unittest discover -s research/phase2 -p 'test_*.py' -v
