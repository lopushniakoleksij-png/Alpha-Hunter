name: Cost Fee Single Writer v0.2 CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'cost_fee_binding_single_writer_v02.sql'
      - 'tests/test_cost_fee_binding_single_writer_v02.py'
      - '.github/workflows/cost-fee-single-writer-v02-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest requests
      - name: Run single-writer fee and safety regressions
        run: >-
          python -m pytest -q
          tests/test_cost_fee_binding_single_writer_v02.py
          tests/test_public_fee_evidence_v01.py
          tests/test_production_gates_v03.py
          tests/test_money_entry_stage_universe_liquidity_binding_v01.py
