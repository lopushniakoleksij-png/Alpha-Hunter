name: Scientific Fingerprint Audit v0.1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'alpha_hunter/**/*.py'
      - '*.sql'
      - 'run.py'
      - 'hourly.py'
      - 'config.json'
      - 'requirements.txt'
      - '.python-version'
      - '.github/workflows/scientific-fingerprint-audit-v01.yml'
  push:
    branches:
      - main
    paths:
      - 'alpha_hunter/**/*.py'
      - '*.sql'
      - 'run.py'
      - 'hourly.py'
      - 'config.json'
      - 'requirements.txt'
      - '.python-version'
      - '.github/workflows/scientific-fingerprint-audit-v01.yml'

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: pip

      - name: Install pinned production dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compute authoritative scientific fingerprint
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from alpha_hunter.collector import load_config
          from alpha_hunter.scientific_identity import build_scientific_fingerprint

          root = Path.cwd()
          config = load_config(root / "config.json")
          result = build_scientific_fingerprint(config, root=root)

          print("SCIENTIFIC_FINGERPRINT_AUDIT")
          print(json.dumps(result, sort_keys=True))
          print(f"fingerprint_sha256={result['sha256']}")
          print(f"file_count={result['file_count']}")
          print(f"runtime_versions={json.dumps(result['runtime_versions'], sort_keys=True)}")
          PY

      - name: Enforce pinned runtime contract
        run: |
          python - <<'PY'
          import importlib.metadata
          import platform
          from pathlib import Path

          expected_python = Path(".python-version").read_text(encoding="utf-8").strip()
          actual_python = platform.python_version()
          if actual_python != expected_python:
              raise SystemExit(
                  f"python pin mismatch: expected={expected_python} actual={actual_python}"
              )

          expected = {
              "requests": "2.34.2",
              "Flask": "3.1.3",
              "gunicorn": "23.0.0",
          }
          for package, version in expected.items():
              actual = importlib.metadata.version(package)
              if actual != version:
                  raise SystemExit(
                      f"{package} pin mismatch: expected={version} actual={actual}"
                  )
          PY
