# P0 source-isolation validation
name: Sealed Run Source Isolation v0.2 CI

on:
  pull_request:
    paths:
      - 'alpha_hunter/collector.py'
      - 'alpha_hunter/scientific_identity.py'
      - 'requirements.txt'
      - '.python-version'
      - 'tests/test_runtime_pins_v01.py'
      - 'alpha_hunter/storage.py'
      - 'hourly.py'
      - 'app.py'
      - 'render_source_lane_compatibility_v01.sql'
      - 'strategy_ready_setups_v01.sql'
      - 'big_mover_supabase_runtime.sql'
      - 'sealed_profitability_source_isolation_v02.sql'
      - 'sealed_scientific_fingerprint_v01.sql'
      - 'tests/test_sealed_run_source_isolation_v02.py'
      - 'tests/test_sealed_scientific_fingerprint_v01.py'
      - 'tests/test_scientific_identity_v01.py'
      - 'tests/test_canonical_previous_snapshot_continuity_v01.py'
      - 'tests/test_render_source_lane_compatibility_v01.py'
      - 'tests/test_strategy_ready_setups_v01.py'
      - 'tests/test_big_mover_fresh_canonical_source_v01.py'
      - '.github/workflows/alpha-hunter-realtime-profitability-test.yml'
      - '.github/workflows/sealed-run-source-isolation-v02-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'alpha_hunter/collector.py'
      - 'alpha_hunter/scientific_identity.py'
      - 'requirements.txt'
      - '.python-version'
      - 'tests/test_runtime_pins_v01.py'
      - 'alpha_hunter/storage.py'
      - 'hourly.py'
      - 'app.py'
      - 'render_source_lane_compatibility_v01.sql'
      - 'strategy_ready_setups_v01.sql'
      - 'big_mover_supabase_runtime.sql'
      - 'sealed_profitability_source_isolation_v02.sql'
      - 'sealed_scientific_fingerprint_v01.sql'
      - 'tests/test_sealed_run_source_isolation_v02.py'
      - 'tests/test_sealed_scientific_fingerprint_v01.py'
      - 'tests/test_scientific_identity_v01.py'
      - '.github/workflows/alpha-hunter-realtime-profitability-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check pytest
      - name: Compile scanner
        run: >
          python -m py_compile
          alpha_hunter/collector.py
          alpha_hunter/scientific_identity.py
          alpha_hunter/storage.py
      - name: Run source-isolation regressions
        run: |
          python -m pytest -q \
            tests/test_sealed_run_source_isolation_v02.py \
            tests/test_sealed_scientific_fingerprint_v01.py \
            tests/test_scientific_identity_v01.py \
            tests/test_runtime_pins_v01.py \
            tests/test_canonical_previous_snapshot_continuity_v01.py \
            tests/test_render_source_lane_compatibility_v01.py \
            tests/test_strategy_ready_setups_v01.py \
            tests/test_big_mover_fresh_canonical_source_v01.py \
            tests/test_sealed_profitability_validation_v01.py \
            tests/test_realtime_profitability_monitor_v01.py \
            tests/test_realtime_test_engine_v01.py \
            tests/test_production_gates_v03.py
      - name: Enforce no order authority
        run: |
          python - <<'PY'
          from pathlib import Path
          text = "\n".join(
              Path(p).read_text(encoding="utf-8").lower()
              for p in (
                  "sealed_profitability_source_isolation_v02.sql",
                  "sealed_scientific_fingerprint_v01.sql",
                  "render_source_lane_compatibility_v01.sql",
                  "strategy_ready_setups_v01.sql",
                  "big_mover_supabase_runtime.sql",
                  "alpha_hunter/collector.py",
                  "alpha_hunter/scientific_identity.py",
                  "alpha_hunter/storage.py",
              )
          )
          forbidden = [
              "trade_permission=true",
              "trade_permission = true",
              "place_order",
              "cancel_order",
              "modify_order",
              "set_leverage",
          ]
          hits = [item for item in forbidden if item in text]
          if hits:
              raise SystemExit(f"forbidden source-isolation authority path(s): {hits}")
          PY
