name: V7.5 Lifecycle Compatibility CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'alpha_hunter/lifecycle.py'
      - 'v75_lifecycle_job.py'
      - 'v75_episode_finalizer.py'
      - 'tests/test_v75_lifecycle_state_compat.py'
      - '.github/workflows/v75-lifecycle-compat-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'alpha_hunter/lifecycle.py'
      - 'v75_lifecycle_job.py'
      - 'v75_episode_finalizer.py'
      - 'tests/test_v75_lifecycle_state_compat.py'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest requests
      - name: Run V7.5 lifecycle compatibility tests
        run: python -m pytest -q tests/test_v75_lifecycle_state_compat.py
