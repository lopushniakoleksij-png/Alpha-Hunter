name: Money Entry Progression Ledger CI

on:
  pull_request:
    paths:
      - 'money_entry_progression_ledger_v02.sql'
      - 'tests/test_money_entry_progression_ledger.py'
      - '.github/workflows/money-entry-progression-ledger-ci.yml'
  push:
    branches:
      - 'feature/money-entry-progression-ledger-*'
    paths:
      - 'money_entry_progression_ledger_v02.sql'
      - 'tests/test_money_entry_progression_ledger.py'
      - '.github/workflows/money-entry-progression-ledger-ci.yml'

permissions:
  contents: read

jobs:
  progression-ledger-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest==8.3.5
      - name: Run progression-ledger contract tests
        run: python -m pytest -q tests/test_money_entry_progression_ledger.py
      - name: Assert fail-closed markers
        run: |
          set -euo pipefail
          grep -F "check (shadow_only=true)" money_entry_progression_ledger_v02.sql
          grep -F "check (trade_permission=false)" money_entry_progression_ledger_v02.sql
          grep -F "ORPHAN_STAGE_WITHOUT_T0" money_entry_progression_ledger_v02.sql
          grep -F "confirmation_tax_r" money_entry_progression_ledger_v02.sql
          ! grep -qiE 'trade_permission[[:space:]]*=[[:space:]]*true|place[-_]order|automatic_trade_execution' money_entry_progression_ledger_v02.sql
