name: Alpha Hunter Fast Discovery Manual Fallback v0.1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha-hunter-fast-discovery-v01
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ALPHA_HUNTER_RUN_SOURCE: GITHUB_FAST_DISCOVERY
      ALPHA_HUNTER_PRODUCTION_VERSION: fast-discovery-manual-fallback-v0.1
      GIT_COMMIT: ${{ github.sha }}
      GIT_BRANCH: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Verify public-data-only fast scanner contract
        shell: bash
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -z "${BITGET_API_KEY:-}"
          test -z "${BITGET_SECRET_KEY:-}"
          test -z "${BITGET_API_PASSPHRASE:-}"

      - name: Run current main scanner
        run: python run.py

      - name: Assert no order authority
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("alpha_hunter/collector.py").read_text(encoding="utf-8").lower()
          forbidden = [
              "place_order(",
              "cancel_order(",
              "modify_order(",
              "set_leverage(",
          ]
          hits = [marker for marker in forbidden if marker in text]
          if hits:
              raise SystemExit(f"fast discovery contains order authority: {hits}")
          print("FAST DISCOVERY SAFETY: PASS")
          PY
