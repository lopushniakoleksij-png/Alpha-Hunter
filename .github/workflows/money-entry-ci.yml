name: Money Entry Engine CI

on:
  pull_request:
    paths:
      - "alpha_hunter/money_entry.py"
      - "tests/test_money_entry.py"
      - ".github/workflows/money-entry-ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile money entry engine
        run: python -m py_compile alpha_hunter/money_entry.py
      - name: Run money entry tests
        run: python -m pytest -q tests/test_money_entry.py
      - name: Run existing regression suite
        run: python -m pytest -q tests
