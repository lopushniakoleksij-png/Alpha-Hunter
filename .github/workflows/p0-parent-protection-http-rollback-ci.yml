name: P0 parent ledger and protection HTTP rollback PG16 PG17
on:
  pull_request:
    paths:
      - 'ops/reviews/phase2_parent_ledger_protection_acceptance_v01.py'
      - 'tests/fixtures/p0_catalog_parent_ledger_protection_addendum_20261102.sql'
      - '.github/workflows/p0-parent-protection-http-rollback-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parent-http-rollback:
    strategy:
      fail-fast: false
      matrix:
        pg: ['16','17']
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgrest:
        image: postgrest/postgrest:v12.2.8
        env:
          PGRST_DB_URI: 'postgres://postgres:isolated-only@postgres:5432/postgres'
          PGRST_DB_SCHEMAS: 'public'
          PGRST_DB_ANON_ROLE: 'postgres'
          PGRST_SERVER_PORT: 3000
        ports:
          - 3000:3000
    env:
      AH_P0_PARENT_LEDGER_LOCAL: '1'
      SUPABASE_URL: ''
      SUPABASE_SERVICE_ROLE_KEY: ''
      BITGET_API_KEY: ''
      RENDER_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Local SQL client and Python drivers
        run: |
          command -v psql || (sudo apt-get update -qq && sudo apt-get install -qq -y postgresql-client)
          python -m pip install --disable-pip-version-check 'psycopg[binary]>=3.2,<3.4' requests
      - name: Actual synthetic parent/ledger/protection PostgREST plus rollback
        run: python ops/reviews/phase2_parent_ledger_protection_acceptance_v01.py
      - name: Preserve synthetic-only evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: parent-ledger-protection-pg${{ matrix.pg }}
          path: parent_ledger_evidence/report.json
          retention-days: 7
          if-no-files-found: error
      - name: No production secrets
        run: |
          test -z "$SUPABASE_URL" && test -z "$SUPABASE_SERVICE_ROLE_KEY"
          test -z "$BITGET_API_KEY" && test -z "$RENDER_API_KEY"
