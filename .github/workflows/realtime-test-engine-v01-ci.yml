name: Realtime Test Engine v0.1 CI

on:
  pull_request:
    paths:
      - 'alpha_hunter/test_engine.py'
      - 'test_engine_job.py'
      - 'test_engine_schema_v01.sql'
      - 'tests/test_realtime_test_engine_v01.py'
      - '.github/workflows/realtime-test-engine-v01-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'alpha_hunter/test_engine.py'
      - 'test_engine_job.py'
      - 'test_engine_schema_v01.sql'
      - 'tests/test_realtime_test_engine_v01.py'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check pytest
      - name: Compile engine
        run: python -m py_compile alpha_hunter/test_engine.py test_engine_job.py
      - name: Run real-time test engine regressions
        run: |
          python -m pytest -q \
            tests/test_realtime_test_engine_v01.py \
            tests/test_sealed_profitability_validation_v01.py \
            tests/test_realtime_profitability_monitor_v01.py \
            tests/test_production_gates_v03.py
      - name: Enforce no execution authority
        run: |
          python - <<'PY'
          from pathlib import Path
          text = "\n".join(
              Path(path).read_text(encoding="utf-8").lower()
              for path in (
                  "alpha_hunter/test_engine.py",
                  "test_engine_job.py",
                  "test_engine_schema_v01.sql",
              )
          )
          forbidden = [
              "place_order",
              "place-order",
              "cancel_order",
              "cancel-order",
              "modify_order",
              "modify-order",
              "set_leverage",
              "set-leverage",
              "trade_permission=true",
              "trade_permission = true",
              "production_execution_enabled=true",
          ]
          hits = [item for item in forbidden if item in text]
          if hits:
              raise SystemExit(f"forbidden test-engine authority path(s): {hits}")
          PY
