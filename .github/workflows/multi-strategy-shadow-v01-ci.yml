name: Multi-Strategy Shadow Engine v0.1 CI

on:
  pull_request:
    paths:
      - 'alpha_hunter/strategy_engine.py'
      - 'alpha_hunter/microstructure.py'
      - 'alpha_hunter/catalyst.py'
      - 'alpha_hunter/strategy_persistence.py'
      - 'alpha_hunter/bitget.py'
      - 'alpha_hunter/collector.py'
      - 'alpha_hunter/storage.py'
      - 'config.json'
      - 'app.py'
      - 'tests/test_multi_strategy_engine_v01.py'
      - 'tests/test_strategy_microstructure_persistence_v01.py'
      - 'tests/test_official_catalyst_evidence_v01.py'
      - 'tests/test_canonical_previous_snapshot_continuity_v01.py'
      - 'tests/test_money_action_dashboard_v72.py'
      - 'tests/test_multi_strategy_dashboard_v01.py'
      - '.github/workflows/multi-strategy-shadow-v01-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'alpha_hunter/strategy_engine.py'
      - 'alpha_hunter/microstructure.py'
      - 'alpha_hunter/catalyst.py'
      - 'alpha_hunter/strategy_persistence.py'
      - 'alpha_hunter/bitget.py'
      - 'alpha_hunter/collector.py'
      - 'alpha_hunter/storage.py'
      - 'config.json'
      - 'app.py'
      - 'tests/test_multi_strategy_engine_v01.py'
      - 'tests/test_strategy_microstructure_persistence_v01.py'
      - 'tests/test_official_catalyst_evidence_v01.py'
      - 'tests/test_canonical_previous_snapshot_continuity_v01.py'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check pytest
      - name: Run multi-strategy and safety regression tests
        run: |
          python -m pytest -q \
            tests/test_multi_strategy_engine_v01.py \
            tests/test_strategy_microstructure_persistence_v01.py \
            tests/test_official_catalyst_evidence_v01.py \
            tests/test_canonical_previous_snapshot_continuity_v01.py \
            tests/test_money_action_dashboard_v72.py \
            tests/test_multi_strategy_dashboard_v01.py \
            tests/test_production_gates_v03.py \
            tests/test_analysis.py
