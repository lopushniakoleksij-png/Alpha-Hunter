name: V8 Browser Verification
on:
  pull_request:
    paths:
      - 'app.py'
      - 'static/v8.css'
      - 'static/v8.js'
      - 'tests/v8_browser_verify_20261105.py'
      - 'tests/test_v8_frontend_contract_20261105.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
      - run: python -m pip install -r requirements.txt pytest playwright
      - run: python -m playwright install chromium
      - run: python tests/v8_browser_verify_20261105.py
      - name: Preserve tested mobile and desktop screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-browser-phase6-screenshots
          path: artifacts/v8-browser/
          if-no-files-found: ignore
          retention-days: 7
