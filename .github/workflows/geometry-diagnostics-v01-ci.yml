name: Geometry Diagnostics v0.1 CI

on:
  pull_request:
    paths:
      - 'geometry_diagnostics_v01.sql'
      - 'tests/test_geometry_diagnostics_v01.py'
      - '.github/workflows/geometry-diagnostics-v01-ci.yml'

permissions:
  contents: read

jobs:
  geometry-diagnostics-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run geometry diagnostics safety tests
        run: pytest -q tests/test_geometry_diagnostics_v01.py
      - name: Independent fail-closed assertions
        run: |
          grep -q "trade_permission boolean not null default false" geometry_diagnostics_v01.sql
          grep -q "research_geometry_is_not_execution_permission" geometry_diagnostics_v01.sql
          ! grep -q "production_execution_enabled=true" geometry_diagnostics_v01.sql
          ! grep -q "/api/v3/trade/place-order" geometry_diagnostics_v01.sql
