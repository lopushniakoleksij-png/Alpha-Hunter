name: Geometry Multi-timeframe Research v0.3 CI

on:
  pull_request:
    paths:
      - 'geometry_multitimeframe_research_v03.sql'
      - 'tests/test_geometry_multitimeframe_research_v03.py'
      - '.github/workflows/geometry-multitimeframe-research-v03-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'geometry_multitimeframe_research_v03.sql'
      - 'tests/test_geometry_multitimeframe_research_v03.py'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest requests
      - name: Run geometry research and production safety tests
        run: >-
          python -m pytest -q
          tests/test_geometry_multitimeframe_research_v03.py
          tests/test_geometry_scope_alignment_v022.py
          tests/test_geometry_forward_science_view_v02.py
          tests/test_money_entry_progression_ledger.py
          tests/test_production_gates_v03.py
