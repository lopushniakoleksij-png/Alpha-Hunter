name: P0.3 real Supabase anonymous gateway negative-only proof
on:
  pull_request:
    paths:
      - '.github/workflows/p03-real-supabase-uncredentialed-negative-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-uncredentialed-denial:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      SUPABASE_URL: ''
      SUPABASE_SERVICE_ROLE_KEY: ''
      SUPABASE_ANON_KEY: ''
      BITGET_API_KEY: ''
      BITGET_SECRET_KEY: ''
    steps:
      - name: External read-only HTTPS negative gate; NO API keys, NO writes
        run: |
          python3 - <<'PY'
          import json, ssl, urllib.request, urllib.error
          project_url = 'https://yjgtjzymfurqzqqxcrnp.supabase.co'
          assert project_url == 'https://yjgtjzymfurqzqqxcrnp.supabase.co'
          # All requests have no apikey and no Authorization header.
          # select+limit is read-only, no database writes or RPC.
          paths = [
            '/rest/v1/alpha_hunter_snapshots?select=run_id&limit=1',
            '/rest/v1/alpha_hunter_symbol_snapshots?select=run_id&limit=1',
            '/rest/v1/alpha_hunter_paper_exit_attempts_v04?select=source_run_id&limit=1',
          ]
          outcomes={}
          ctx=ssl.create_default_context()
          for path in paths:
              request=urllib.request.Request(
                  project_url+path,method='GET',
                  headers={'Accept':'application/json','User-Agent':'AH-P03-NoKey-Negative-Probe/1.0'})
              try:
                  with urllib.request.urlopen(request,timeout=18,context=ctx) as response:
                      code=response.status
                      response.read(1024)
              except urllib.error.HTTPError as error:
                  code=error.code
                  error.read(1024)
              # Do not print any row values; successful HTTP 200 is a hard failure.
              if code not in (401,403):
                  raise AssertionError('Expected API key gate denial, route status='+str(code))
              outcomes[path.split('?')[0].rsplit('/',1)[-1]]=code
          print(json.dumps({
              'result':'LIVE_SUPABASE_NO_KEY_READ_DENIAL_PASS',
              'verified_at':'runtime_github_actions',
              'routes_status_only':outcomes,
              'network':'live_project_gateway_read_only',
              'anon_authenticated_service_role_tested':False,
              'production_schema_or_data_changed':False,
              'independent_security_signoff':False,
              'release_authorized':False,
          },sort_keys=True))
          PY
      - name: Ensure credential-free boundary
        run: |
          test -z "$SUPABASE_URL"
          test -z "$SUPABASE_SERVICE_ROLE_KEY"
          test -z "$SUPABASE_ANON_KEY"
          test -z "$BITGET_API_KEY"
          test -z "$BITGET_SECRET_KEY"
