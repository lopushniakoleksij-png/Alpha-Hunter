name: Public Fee Evidence v0.1 CI

on:
  pull_request:
    paths:
      - 'alpha_hunter/universe_ledger.py'
      - 'public_fee_evidence_v01.sql'
      - 'tests/test_public_fee_evidence_v01.py'
      - '.github/workflows/public-fee-evidence-v01-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'alpha_hunter/universe_ledger.py'
      - 'public_fee_evidence_v01.sql'
      - 'tests/test_public_fee_evidence_v01.py'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest requests
      - name: Run fee evidence and safety regressions
        run: >-
          python -m pytest -q
          tests/test_public_fee_evidence_v01.py
          tests/test_universe_ledger_single_scanner.py
          tests/test_money_entry_stage_universe_liquidity_binding_v01.py
          tests/test_production_gates_v03.py
