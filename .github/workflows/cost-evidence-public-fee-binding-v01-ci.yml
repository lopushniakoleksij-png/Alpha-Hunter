name: Cost Evidence Public Fee Binding v0.1 CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'cost_evidence_public_fee_binding_v01.sql'
      - 'tests/test_cost_evidence_public_fee_binding_v01.py'
      - '.github/workflows/cost-evidence-public-fee-binding-v01-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest requests
      - name: Run cost evidence and production safety regressions
        run: >-
          python -m pytest -q
          tests/test_cost_evidence_public_fee_binding_v01.py
          tests/test_production_gates_v03.py
          tests/test_money_entry_stage_position_conflict_binding_v01.py
          tests/test_canonical_account_ledger_materialization_v01.py
