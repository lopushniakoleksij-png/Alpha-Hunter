name: Money Entry Stage Universe Liquidity Binding CI

on:
  pull_request:
    paths:
      - 'money_entry_stage_universe_liquidity_binding_v01.sql'
      - 'money_entry_stage_single_writer.sql'
      - 'tests/test_money_entry_stage_universe_liquidity_binding_v01.py'
      - '.github/workflows/money-entry-stage-universe-liquidity-binding-ci.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Verify forward-only fail-closed universe binding contract
        run: python -m pytest -q tests/test_money_entry_stage_universe_liquidity_binding_v01.py tests/test_production_gates_v03.py
