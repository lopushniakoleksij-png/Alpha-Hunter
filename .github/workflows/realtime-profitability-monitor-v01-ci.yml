name: Realtime Profitability Monitor v0.1 CI

on:
  pull_request:
    paths:
      - 'realtime_profitability_monitor_v01.sql'
      - 'tests/test_realtime_profitability_monitor_v01.py'
      - '.github/workflows/realtime-profitability-monitor-v01-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'realtime_profitability_monitor_v01.sql'
      - 'tests/test_realtime_profitability_monitor_v01.py'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run realtime monitor contract tests
        run: python -m pytest -q tests/test_realtime_profitability_monitor_v01.py
