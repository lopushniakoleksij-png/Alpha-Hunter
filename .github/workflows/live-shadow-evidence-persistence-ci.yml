name: Live Shadow Evidence Persistence CI

on:
  pull_request:
    branches:
      - live/alpha-hunter-5d-20260816
    paths:
      - 'run.py'
      - 'alpha_hunter/universe_ledger.py'
      - 'alpha_hunter/account_ledger.py'
      - 'tests/test_universe_ledger_single_scanner.py'
      - 'tests/test_canonical_account_ledger.py'
      - '.github/workflows/live-shadow-evidence-persistence-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest requests
      - name: Run focused evidence tests
        run: >-
          python -m pytest -q
          tests/test_universe_ledger_single_scanner.py
          tests/test_canonical_account_ledger.py
      - name: Enforce shadow-only deployment contract
        run: |
          python - <<'PY'
          from pathlib import Path
          paths = [
              Path('run.py'),
              Path('alpha_hunter/universe_ledger.py'),
              Path('alpha_hunter/account_ledger.py'),
          ]
          source = '\n'.join(p.read_text(encoding='utf-8') for p in paths)
          forbidden = [
              'place_order(', 'submit_order(', 'create_order(', 'cancel_order(',
              '/api/v2/mix/order/place-order', '/api/v2/mix/order/cancel-order',
              'trade_permission": True', "'trade_permission': True",
          ]
          hits = [token for token in forbidden if token in source]
          if hits:
              raise SystemExit(f'Forbidden live-write/trade-permission tokens: {hits}')
          account_source = Path('alpha_hunter/account_ledger.py').read_text(encoding='utf-8')
          if 'BitgetClient' in account_source or 'futures_accounts(' in account_source or 'futures_positions(' in account_source:
              raise SystemExit('Account ledger must not make an extra Bitget request')
          print('shadow-only evidence persistence contract: PASS')
          PY
