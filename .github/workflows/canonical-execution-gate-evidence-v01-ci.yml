name: Canonical Execution Gate Evidence v0.1 CI

on:
  pull_request:
    paths:
      - 'canonical_execution_gate_evidence_v01.sql'
      - 'tests/test_canonical_execution_gate_evidence_v01.py'
      - '.github/workflows/canonical-execution-gate-evidence-v01-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run canonical execution-gate contract tests
        run: python -m pytest tests/test_canonical_execution_gate_evidence_v01.py -q
