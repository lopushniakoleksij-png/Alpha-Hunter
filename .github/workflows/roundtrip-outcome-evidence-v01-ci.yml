name: Round-trip Outcome Evidence v0.1 CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'roundtrip_outcome_evidence_v01.sql'
      - 'ops/sql/profit_retention_lifecycle_v01.sql'
      - 'ops/sql/profit_management_shadow_challenger_v01.sql'
      - 'ops/sql/profit_management_forward_v01.sql'
      - 'ops/sql/money_economic_ledger_v01.sql'
      - 'ops/sql/trade_decision_context_v01.sql'
      - 'tests/test_roundtrip_outcome_evidence_v01.py'
      - 'tests/test_profit_retention_lifecycle_v01.py'
      - 'tests/test_profit_management_shadow_challenger_v01.py'
      - 'tests/test_profit_management_forward_v01.py'
      - 'tests/test_money_economic_ledger_v01.py'
      - 'tests/test_trade_decision_context_v01.py'
      - '.github/workflows/roundtrip-outcome-evidence-v01-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'roundtrip_outcome_evidence_v01.sql'
      - 'ops/sql/profit_retention_lifecycle_v01.sql'
      - 'tests/test_roundtrip_outcome_evidence_v01.py'
      - 'tests/test_profit_retention_lifecycle_v01.py'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest requests pglast==8.4
      - name: Run round-trip evidence regressions
        run: >-
          python -m pytest -q
          tests/test_roundtrip_outcome_evidence_v01.py
          tests/test_profit_retention_lifecycle_v01.py
          tests/test_profit_management_shadow_challenger_v01.py
          tests/test_profit_management_forward_v01.py
          tests/test_money_economic_ledger_v01.py
          tests/test_trade_decision_context_v01.py
          tests/test_canonical_readonly_fill_ledger_v01.py
          tests/test_fill_traceability_membership_v01.py
          tests/test_realized_fee_evidence_v01.py
          tests/test_fill_origin_attribution_guard_v01.py
