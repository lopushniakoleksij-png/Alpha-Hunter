name: Universe Ledger Single Scanner CI

on:
  pull_request:
    paths:
      - 'alpha_hunter/universe_ledger.py'
      - 'run.py'
      - 'tests/test_universe_ledger_single_scanner.py'
      - '.github/workflows/universe-ledger-single-scanner-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'alpha_hunter/universe_ledger.py'
      - 'run.py'
      - 'tests/test_universe_ledger_single_scanner.py'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run universe-ledger and production safety tests
        run: python -m pytest -q tests/test_universe_ledger_single_scanner.py tests/test_production_gates_v03.py
