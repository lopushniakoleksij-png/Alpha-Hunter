name: P0 Legacy Five Bitget Candle Replay (Read Only)
on:
  pull_request:
    paths:
      - '.github/workflows/p0-legacy-five-bitget-replay-20261016.yml'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - name: Fetch public historical 1m bars; never mutate paper evidence
        shell: bash
        run: |
          python - <<'PY'
          import json,hashlib,time,urllib.parse,urllib.request,ssl,pathlib
          from datetime import datetime,timezone
          from decimal import Decimal
          trades=[
            dict(symbol="MEGAUSDT",side="SHORT",reason="TAKE_PROFIT",entry="2026-10-06T17:04:44.921899Z",exit="2026-10-08T15:24:29.257433Z",stop="0.04723",target="0.04136",exit_id="5a62db65b34140b9f2c99db3141080fe"),
            dict(symbol="WLDUSDT",side="SHORT",reason="TAKE_PROFIT",entry="2026-10-06T17:23:24.66843Z",exit="2026-10-08T15:43:57.386258Z",stop="0.5602",target="0.4802",exit_id="eaded4da90d1134de677486ff242546e"),
            dict(symbol="EIGENUSDT",side="LONG",reason="STOP_LOSS",entry="2026-10-02T13:43:25.980324Z",exit="2026-10-02T23:03:39.440554Z",stop="0.2592",target="0.2856",exit_id="251087fc5bc3a589a502fb9cf40f10f9"),
            dict(symbol="EVAAUSDT",side="LONG",reason="STOP_LOSS",entry="2026-10-02T16:07:20.140379Z",exit="2026-10-08T17:04:38.332281Z",stop="0.6923",target="0.7867",exit_id="dd02a41f409cd405029a6fd9e4fa5d45"),
            dict(symbol="SUPERUSDT",side="SHORT",reason="STOP_LOSS",entry="2026-10-07T15:05:01.343555Z",exit="2026-10-08T15:24:29.257433Z",stop="0.2233",target="0.1953",exit_id="86eb8533e91e44283c9f516c1d330954")
          ]
          ROOT=pathlib.Path("p0-legacy-public-evidence")
          ROOT.mkdir(exist_ok=True)
          (ROOT/"canonical-input.json").write_text(json.dumps(trades,indent=2,sort_keys=True))
          STEP=60_000
          def ms(s): return int(datetime.fromisoformat(s.replace("Z","+00:00")).timestamp()*1000)
          def get(t,start,end,page):
              qs=urllib.parse.urlencode(dict(category="USDT-FUTURES",symbol=t["symbol"],interval="1m",type="market",startTime=start-STEP,endTime=end+STEP,limit=100))
              url="https://api.bitget.com/api/v3/market/history-candles?"+qs
              request=urllib.request.Request(url,headers={"User-Agent":"AH-P0-public-historical-research/1.0","Accept":"application/json"})
              last=None
              for k in range(3):
                  try:
                      with urllib.request.urlopen(request,timeout=18,context=ssl.create_default_context()) as r:
                          assert r.status==200
                          raw=r.read(200000)
                      body=json.loads(raw)
                      if body.get("code")!="00000" or not isinstance(body.get("data"),list):
                          raise ValueError("BAD_API_RESPONSE "+str(body.get("code"))+" "+str(body.get("msg")))
                      source=ROOT/(t["symbol"]+"_"+str(page)+".json")
                      source.write_bytes(raw)
                      return body["data"],dict(window_start=start,window_end=end,response_sha256=hashlib.sha256(raw).hexdigest(),exchange_request_time=body.get("requestTime"),page=page,candle_rows=len(body["data"]))
                  except Exception as err:
                      last=str(err)
                      if k<2: time.sleep(1+k)
              raise RuntimeError("PUBLIC_API_FAILURE "+str(last))
          def check(t):
              out=dict(symbol=t["symbol"],exit_id=t["exit_id"],recorded_reason=t["reason"],source="BITGET_PUBLIC_V3_1M_HISTORY_CANDLES",source_authentication="TLS_ONLY_NOT_INDEPENDENTLY_ATTESTED",independent_quote_proof=False,execution_price_verified=False,profitability_claim_permitted=False,trade_permission=False,production_promotion_permitted=False,original_exit_rewritten=False,counterfactual_only=True,complete=False,status="DATA_INSUFFICIENT")
              first=(ms(t["entry"])//STEP)*STEP;last=(ms(t["exit"])//STEP)*STEP
              n=(last-first)//STEP+1
              out["expected_minutes"]=n
              out["pages_expected"]=(n+89)//90
              bars={};proof=[]
              try:
                  for i,j in enumerate(range(0,n,90)):
                      a=first+j*STEP;b=first+min(n-1,j+89)*STEP
                      data,digest=get(t,a,b,i)
                      proof.append(digest)
                      for row in data:
                          if not isinstance(row,list) or len(row)<5: raise ValueError("INVALID_CANDLE_SCHEMA")
                          stamp=int(row[0])
                          if not(a<=stamp<=b):continue
                          if stamp%STEP:raise ValueError("UNALIGNED_TIMESTAMP")
                          o,h,l,c=map(Decimal,row[1:5])
                          if not(l>0 and h>=max(o,c,l) and l<=min(o,h,c)):
                              raise ValueError("BAD_OHLC")
                          record=[str(x) for x in (o,h,l,c)]
                          if stamp in bars and bars[stamp]!=record:raise ValueError("CONFLICTING_CANDLE")
                          bars[stamp]=record
                      if i==0:print("FIRST_PAGE",t["symbol"],"rows",len(data),"range",a,b,"unique_bars",len(bars),flush=True)
                      time.sleep(0.07)
                  out["pages"]=len(proof)
                  out["page_digests"]=proof
                  out["observed_minutes"]=len(bars)
                  missing=[first+i*STEP for i in range(n) if first+i*STEP not in bars]
                  if missing:
                      out.update(status="DATA_INSUFFICIENT",blocker="MISSING_CANDLES",missing_count=len(missing),first_missing_ms=missing[0])
                      return out
                  out["complete"]=True
                  normal=[[k,*bars[k]] for k in sorted(bars)]
                  raw=json.dumps(normal,separators=(",",":")).encode()
                  out["normalized_candles_sha256"]=hashlib.sha256(raw).hexdigest()
                  (ROOT/(t["symbol"]+"_normalized.json")).write_bytes(raw)
                  stop=Decimal(t["stop"]);target=Decimal(t["target"])
                  if not((stop<target) if t["side"]=="LONG" else (target<stop)):raise ValueError("INVALID_STOP_TARGET_GEOMETRY")
                  for stamp,o,h,l,c in normal:
                      h,l=Decimal(h),Decimal(l)
                      hit_stop=(l<=stop if t["side"]=="LONG" else h>=stop)
                      hit_target=(h>=target if t["side"]=="LONG" else l<=target)
                      if not(hit_stop or hit_target):continue
                      if stamp==first:kind="ENTRY_MINUTE_ORDERING_AMBIGUOUS"
                      elif hit_stop and hit_target:kind="AMBIGUOUS_SAME_MINUTE"
                      elif hit_stop:kind="STOP_LOSS"
                      else:kind="TAKE_PROFIT"
                      out.update(status=kind,first_touch_utc=datetime.fromtimestamp(stamp/1000,timezone.utc).isoformat(),first_touch_ms=stamp,touch_to_observed_exit_minutes=round((ms(t["exit"])-stamp)/STEP,3),recorded_reason_matches=(kind==t["reason"] if kind in ("STOP_LOSS","TAKE_PROFIT") else None),blocker=None if kind in ("STOP_LOSS","TAKE_PROFIT") else "CANDLE_INTRAMINUTE_ORDERING_UNPROVEN")
                      break
                  if out["status"]=="DATA_INSUFFICIENT":
                      out["status"]="NO_MINUTE_TOUCH_FOUND"
                      out["blocker"]="NO_TOUCH_IN_COMPLETE_PATH"
              except Exception as exc:
                  out["status"]="DATA_INSUFFICIENT"
                  out["blocker"]=type(exc).__name__+":"+str(exc)[:180]
                  out["pages"]=len(proof)
                  out["page_digests"]=proof
                  out["observed_minutes"]=len(bars)
              return out
          report=[]
          for t in trades:
              r=check(t)
              report.append(r)
              print("REPLAY_RESULT",json.dumps({k:v for k,v in r.items() if k not in ("page_digests",)},sort_keys=True),flush=True)
          (ROOT/"replay-results.json").write_text(json.dumps({"contract":"READ_ONLY_LEGACY_BAR_INFERENCE_V01","results":report,"r9_unchanged":True},indent=2,sort_keys=True))
          print("SUMMARY",json.dumps([{"symbol":r["symbol"],"complete":r["complete"],"status":r["status"],"observed":r.get("observed_minutes"),"expected":r["expected_minutes"],"pages":r.get("pages"),"blocker":r.get("blocker")} for r in report]),flush=True)
          PY
      - name: Save original public response custody (not scientific approval)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-legacy-public-bitget-1m-replay
          path: p0-legacy-public-evidence/
          retention-days: 14
