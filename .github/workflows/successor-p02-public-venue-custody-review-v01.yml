name: P02 Public Venue HTTPS and Isolated Custody Review

on:
  pull_request:
    paths:
      - 'ops/reviews/successor_public_https_capture_v01.py'
      - 'ops/reviews/successor_public_https_pg16_custody_v01.py'
      - 'ops/reviews/successor_selected_public_quote_artifact_20261023.py'
      - 'tests/test_successor_public_https_capture_v01.py'
      - '.github/workflows/successor-p02-public-venue-custody-review-v01.yml'

permissions:
  contents: read

concurrency:
  group: p02-public-venue-custody-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-https-independent-journal:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_URL: ''
      SUPABASE_SERVICE_ROLE_KEY: ''
      DATABASE_URL: ''
      BITGET_API_KEY: ''
      BITGET_SECRET_KEY: ''
      BITGET_API_PASSPHRASE: ''
    services:
      main:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bench
          POSTGRES_PASSWORD: benchpass
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bench -d postgres"
          --health-interval 5s
          --health-timeout 4s
          --health-retries 12
      journal:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: journal
          POSTGRES_PASSWORD: journalpass
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U journal -d postgres"
          --health-interval 5s
          --health-timeout 4s
          --health-retries 12
    steps:
      - name: Checkout draft branch only
        uses: actions/checkout@v4
      - name: Install isolated Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated PostgreSQL driver
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'psycopg[binary]==3.2.10'
      - name: P0.2 public HTTPS ticker, independent journal and real fault tests
        env:
          AH_P02_ONE_SHOT_APPROVAL: EPHEMERAL_CI_PUBLIC_GET_ONLY
          AH_P02_EXPORT_PUBLIC_QUOTE_PROOF: EPHEMERAL_CI_ARTIFACT_ONLY
          AH_SHADOW_POSTGRES_APPROVED: EPHEMERAL_GITHUB_ACTIONS_ONLY
          AH_SHADOW_PG_DSN: postgresql://bench:benchpass@127.0.0.1:5432/postgres
          AH_SHADOW_JOURNAL_APPROVED: EPHEMERAL_GITHUB_ACTIONS_ONLY
          AH_SHADOW_JOURNAL_DSN: postgresql://journal:journalpass@127.0.0.1:5433/postgres
        run: python ops/reviews/successor_public_https_pg16_custody_v01.py
      - name: One-shot public NIGHT/SOON quote research, no source/position keys
        env:
          AH_P02_SYMBOL_PROBE_APPROVAL: EPHEMERAL_CI_PUBLIC_GET_ONLY
        run: python ops/reviews/successor_selected_public_quote_artifact_20261023.py
      - name: Preserve bounded-retention public-quote bytes and SHA256 manifest (NOT permanent custody)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p02-one-shot-public-bitget-raw-quote-${{ github.run_id }}
          path: p02-public-quote-ci-proof/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
