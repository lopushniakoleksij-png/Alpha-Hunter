name: P0 signed-history isolated PostgreSQL PostgREST 16-17
on:
  pull_request:
    paths:
      - 'ops/reviews/p03_historical_successor_fail_closed_v01.py'
      - 'ops/reviews/p03_isolated_signed_history_postgrest_v01.py'
      - 'tests/test_p03_isolated_signed_history_postgrest_v01.py'
      - '.github/workflows/p03-isolated-signed-history-pg-ci.yml'
  push:
    branches:
      - research/p03-isolated-signed-history-validator-20261103

permissions:
  contents: read

jobs:
  signed-history-local-pg:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '17']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgrest:
        image: postgrest/postgrest:v12.2.8
        env:
          PGRST_DB_URI: "postgres://postgres:isolated-only@postgres:5432/postgres"
          PGRST_DB_SCHEMAS: "public"
          PGRST_DB_ANON_ROLE: "postgres"
          PGRST_SERVER_PORT: 3000
        ports:
          - 3000:3000
    env:
      AH_LOCAL_POSTGREST_ONLY: '1'
      AH_LOCAL_PG_DSN: 'host=127.0.0.1 port=5432 dbname=postgres user=postgres password=isolated-only'
      SUPABASE_URL: ''
      SUPABASE_SERVICE_ROLE_KEY: ''
      BITGET_API_KEY: ''
      BITGET_SECRET_KEY: ''
      BITGET_API_PASSPHRASE: ''
      RENDER_API_KEY: ''
      TRADING_ENABLED: 'false'
      PAPER_ONLY: 'true'
      ORDER_PATH: 'NONE'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
      - name: Install pinned dependencies for local real DB tests
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check pytest 'psycopg[binary]>=3.2,<3.4' 'cryptography==46.0.4'
      - name: Assert no real credentials or trading authority
        run: |
          test -z "$SUPABASE_URL"
          test -z "$SUPABASE_SERVICE_ROLE_KEY"
          test -z "$BITGET_API_KEY"
          test -z "$RENDER_API_KEY"
          test "$TRADING_ENABLED" = "false"
          test "$PAPER_ONLY" = "true"
          test "$ORDER_PATH" = "NONE"
      - name: Real local PostgREST signed history replay and negative tests
        run: >-
          python -m pytest -q
          tests/test_p03_isolated_signed_history_postgrest_v01.py
          tests/test_p03_historical_successor_fail_closed_v01.py
      - name: Confirm research-only result
        run: echo "PASS only for synthetic isolated history; production NO-GO."
