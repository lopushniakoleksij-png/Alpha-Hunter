name: Strategy Opportunity Path v0.1 CI

on:
  pull_request:
    paths:
      - 'strategy_opportunity_path_v01.sql'
      - 'tests/test_strategy_opportunity_path_v01.py'
      - 'strategy_forward_outcome_ledger_v01.sql'
      - 'alpha_hunter/strategy_engine.py'
      - 'alpha_hunter/strategy_persistence.py'
      - '.github/workflows/strategy-opportunity-path-v01-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'strategy_opportunity_path_v01.sql'
      - 'tests/test_strategy_opportunity_path_v01.py'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check pytest
      - name: Run opportunity-path and forward-ledger contract tests
        run: |
          python -m pytest -q \
            tests/test_strategy_opportunity_path_v01.py \
            tests/test_strategy_forward_outcome_ledger_v01.py
      - name: Reject execution authority and external market scans
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('strategy_opportunity_path_v01.sql').read_text().lower()
          forbidden = [
              'trade_permission=true',
              'trade_permission = true',
              'production_execution_enabled=true',
              'place_order',
              'cancel_order',
              'modify_order',
              'set_leverage',
              'api.bitget.com',
              'market/tickers',
              'market/candles',
          ]
          hits = [item for item in forbidden if item in text]
          if hits:
              raise SystemExit(f'forbidden opportunity-path authority/source path(s): {hits}')
          PY
