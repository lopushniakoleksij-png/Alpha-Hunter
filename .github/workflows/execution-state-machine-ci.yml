name: Execution State Machine CI

on:
  pull_request:
    paths:
      - 'alpha_hunter/execution_state_machine.py'
      - 'tests/test_execution_state_machine.py'
      - '.github/workflows/execution-state-machine-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile
        run: python -m py_compile alpha_hunter/execution_state_machine.py tests/test_execution_state_machine.py
      - name: Run focused tests
        run: python -m pytest tests/test_execution_state_machine.py -q
      - name: Safety contract
        run: |
          python - <<'PY'
          from alpha_hunter.execution_state_machine import live_execution_available
          assert live_execution_available() is False
          print('LIVE execution remains hard-disabled')
          PY
