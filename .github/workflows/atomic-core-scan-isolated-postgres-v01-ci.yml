name: Atomic Core Scan Isolated PostgreSQL QA

on:
  push:
    branches:
      - fix/supabase-write-timeout-qa
    paths:
      - 'ops/sql/qa_atomic_core_scan_ephemeral_schema_v01.sql'
      - 'ops/sql/qa_atomic_core_scan_ephemeral_assertions_v01.sql'
      - 'ops/sql/qa_atomic_core_scan_fifty_symbols_v01.sql'
      - 'ops/sql/qa_atomic_core_scan_30_61_timeout_v01.sql'
      - 'ops/sql/qa_atomic_core_scan_real_timeout_setup_v01.sql'
      - 'ops/sql/qa_atomic_core_scan_real_timeout_verify_v01.sql'
      - 'ops/local/qa_atomic_core_scan_real_statement_timeout_v01.sh'
      - 'ops/local/qa_atomic_core_scan_lost_ack_v01.sh'
      - 'ops/sql/qa_atomic_core_scan_lost_ack_setup_v01.sql'
      - 'ops/sql/qa_atomic_core_scan_lost_ack_verify_v01.sql'
      - 'ops/sql/qa_atomic_core_scan_concurrent_setup_v01.sql'
      - 'ops/sql/qa_atomic_core_scan_concurrent_verify_v01.sql'
      - 'ops/local/qa_atomic_core_scan_concurrent_v01.py'
      - 'ops/sql/qa_atomic_core_scan_service_role_v01.sql'
      - 'ops/sql/readonly_core_scan_failure_taxonomy_v01.sql'
      - 'ops/sql/qa_core_scan_failure_taxonomy_fixture_v01.sql'
      - 'ops/sql/atomic_core_scan_rpc_candidate_v01.sql'
      - 'ops/sql/strategy_payoff_percentile_hotpath_index_candidate_v01.sql'
      - 'ops/sql/qa_payoff_percentile_synthetic_benchmark_v01.sql'
      - 'ops/sql/qa_atomic_fullpath_505k_benchmark_setup_v01.sql'
      - 'ops/sql/qa_atomic_fullpath_505k_benchmark_verify_v01.sql'
      - 'ops/local/qa_atomic_fullpath_505k_benchmark_v01.py'
      - 'ops/sql/qa_atomic_fullpath_2x2_sequential_v01.sql'
      - 'ops/sql/qa_atomic_fullpath_2x2_verify_v01.sql'
      - 'ops/local/qa_atomic_fullpath_2x2_matrix_v01.py'
      - 'tests/test_atomic_core_scan_rpc_candidate.py'
      - 'tests/test_atomic_core_scan_transport_retry_v01.py'
      - 'ops/sql/readonly_core_scan_trigger_inventory_v01.sql'
      - 'docs/atomic-core-scan-release-gate-20261107.md'
      - '.github/workflows/atomic-core-scan-isolated-postgres-v01-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-sql-rollback:
    name: Ephemeral PostgreSQL 17 rollback and idempotency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated_test_password
          POSTGRES_DB: isolated_atomic_scan_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d isolated_atomic_scan_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: isolated_test_password
      PGDATABASE: isolated_atomic_scan_qa
    steps:
      - name: Check out isolated QA branch
        uses: actions/checkout@v4
      - name: Guard production branch and verify client
        run: |
          test "${GITHUB_REF_NAME}" = "fix/supabase-write-timeout-qa"
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql --version
      - name: Re-run current Python persistence regressions
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install -q -r requirements.txt pytest
          python -m pytest -q tests/test_storage.py tests/test_canonical_universe_scan_persistence_v02.py tests/test_scan_partial_persistence_characterization.py tests/test_atomic_core_scan_rpc_candidate.py tests/test_atomic_core_scan_transport_retry_v01.py
      - name: Verify read-only scan failure taxonomy in isolated PostgreSQL 17
        run: |
          set -euo pipefail
          createdb isolated_taxonomy_qa
          psql -X -v ON_ERROR_STOP=1 -d isolated_taxonomy_qa -f ops/sql/qa_core_scan_failure_taxonomy_fixture_v01.sql
          psql -X -v ON_ERROR_STOP=1 -At -F ',' -d isolated_taxonomy_qa -f ops/sql/readonly_core_scan_failure_taxonomy_v01.sql > /tmp/qa-taxonomy.txt
          test "$(grep -c '^QA_' /tmp/qa-taxonomy.txt)" -eq 4
          grep -Eq '^QA_COMPLETE,.*,snapshot-parent-v0[.]2,RENDER_CRON,SOURCE_CLAIM_PRESENT_NOT_AUTHENTICATED,CORE_PASS$' /tmp/qa-taxonomy.txt
          grep -Eq '^QA_READY_MISSING,.*,UNVERSIONED,UNATTRIBUTED,MISSING_SOURCE_CLAIM,READINESS_MISSING$' /tmp/qa-taxonomy.txt
          grep -Eq '^QA_UNVERSIONED_COMPLETE,.*,UNVERSIONED,UNATTRIBUTED,MISSING_SOURCE_CLAIM,CORE_PASS$' /tmp/qa-taxonomy.txt
          grep -Eq '^QA_PARENT_ONLY,.*,snapshot-parent-v0[.]2,RENDER_CRON,SOURCE_CLAIM_PRESENT_NOT_AUTHENTICATED,PARENT_ONLY$' /tmp/qa-taxonomy.txt
          echo "PASS: all three zero-error-count failure categories classified correctly"
      - name: Construct synthetic core schema and trigger graph
        run: psql -X -v ON_ERROR_STOP=1 -f ops/sql/qa_atomic_core_scan_ephemeral_schema_v01.sql
      - name: Install candidate function in ephemeral test database ONLY
        run: psql -X -v ON_ERROR_STOP=1 -f ops/sql/atomic_core_scan_rpc_candidate_v01.sql
      - name: Verify rollback, replay, completeness, and restricted privileges
        run: psql -X -v ON_ERROR_STOP=1 -f ops/sql/qa_atomic_core_scan_ephemeral_assertions_v01.sql
      - name: Prove 50-symbol atomic rollback, full persistence and idempotent replay
        run: psql -X -v ON_ERROR_STOP=1 -f ops/sql/qa_atomic_core_scan_fifty_symbols_v01.sql
      - name: Verify 61-symbol 57014 atomic rollback and 30-symbol source-aware replay
        run: psql -X -v ON_ERROR_STOP=1 -f ops/sql/qa_atomic_core_scan_30_61_timeout_v01.sql
      - name: Verify real PostgreSQL statement_timeout rollback and idempotent retry
        run: bash ops/local/qa_atomic_core_scan_real_statement_timeout_v01.sh
      - name: E3 simulate committed response lost then idempotent retry in separate sessions
        run: bash ops/local/qa_atomic_core_scan_lost_ack_v01.sh
      - name: E6 verify overlapping identical/conflicting atomic RPCs across independent PostgreSQL sessions
        run: python3 ops/local/qa_atomic_core_scan_concurrent_v01.py
      - name: Validate service_role RPC invocation under RLS with denied public roles
        run: psql -X -v ON_ERROR_STOP=1 -f ops/sql/qa_atomic_core_scan_service_role_v01.sql
      - name: Compare payoff percentile query against 495k synthetic outcomes
        run: psql -X -v ON_ERROR_STOP=1 -f ops/sql/qa_payoff_percentile_synthetic_benchmark_v01.sql
      - name: Harada C6-C7 benchmark combined atomic RPC with synthetic 505569-outcome nested graph
        run: python3 ops/local/qa_atomic_fullpath_505k_benchmark_v01.py
      - name: Harada D 2x2 sequential vs atomic and current vs proposed indexing QA
        run: python3 ops/local/qa_atomic_fullpath_2x2_matrix_v01.py
