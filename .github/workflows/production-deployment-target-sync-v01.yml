name: Production Deployment Target Sync v0.1

on:
  push:
    branches:
      - main
    paths:
      - "alpha_hunter/**"
      - "run.py"
      - "hourly.py"
      - "performance_job.py"
      - "feature_job.py"
      - "outcome_job.py"
      - "config.json"
      - "requirements.txt"
      - ".python-version"
      - "ops/collect_execution_quality_readonly.py"
      - "ops/collect_candidate_retention_shadow.py"
      - "ops/collect_v15_ranking_challenger.py"
      - "ops/runtime_release_fingerprint.py"

permissions:
  contents: read

jobs:
  sync-production-target:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TARGET_SHA: ${{ github.sha }}
      TARGET_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout runtime source
        uses: actions/checkout@v4

      - name: Compute runtime release fingerprint
        id: runtime
        shell: bash
        run: |
          python ops/runtime_release_fingerprint.py --github-output

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"

      - name: Append production release target
        shell: python
        env:
          TARGET_RUNTIME_FINGERPRINT: ${{ steps.runtime.outputs.runtime_fingerprint_sha256 }}
        run: |
          import json
          import os
          import socket
          import time
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          url = os.environ["SUPABASE_URL"].rstrip("/")
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          sha = os.environ["TARGET_SHA"]
          repository = os.environ["TARGET_REPOSITORY"]
          runtime_fingerprint = os.environ["TARGET_RUNTIME_FINGERPRINT"]

          if len(runtime_fingerprint) != 64:
              raise SystemExit("runtime fingerprint is not a SHA-256 hex digest")

          payload = {
              "release_target_id": sha,
              "git_commit": sha,
              "runtime_fingerprint_sha256": runtime_fingerprint,
              "recorded_at_utc": datetime.now(timezone.utc).isoformat(),
              "source": "GITHUB_RUNTIME_PUSH",
              "repository": repository,
              "shadow_only": True,
              "trade_permission": False,
              "production_promotion_permitted": False,
              "order_path": "NONE",
          }

          endpoint = (
              url + "/rest/v1/alpha_hunter_production_release_targets_v01"
          )
          body = json.dumps(payload, separators=(",", ":")).encode("utf-8")
          headers = {
              "apikey": key,
              "Authorization": "Bearer " + key,
              "Content-Type": "application/json",
              "Prefer": "resolution=ignore-duplicates,return=minimal",
          }

          max_attempts = 4
          retry_delays = (5, 10, 20)
          last_error = None

          for attempt in range(1, max_attempts + 1):
              request = urllib.request.Request(
                  endpoint,
                  data=body,
                  method="POST",
                  headers=headers,
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      if response.status not in (200, 201, 204):
                          raise RuntimeError(
                              f"unexpected HTTP {response.status}"
                          )
                  print("Render Cron runtime release target recorded. "
                        f"attempt={attempt}.")
                  break
              except urllib.error.HTTPError as exc:
                  last_error = f"HTTP {exc.code}"
                  retryable = exc.code == 429 or exc.code >= 500
                  if not retryable or attempt == max_attempts:
                      raise SystemExit(
                          "release target sync failed: " + last_error
                      )
              except (
                  urllib.error.URLError,
                  TimeoutError,
                  socket.timeout,
                  RuntimeError,
              ) as exc:
                  last_error = exc.__class__.__name__
                  if attempt == max_attempts:
                      raise SystemExit(
                          "release target sync failed after retries: "
                          + last_error
                      )

              delay = retry_delays[attempt - 1]
              print(
                  f"Supabase release-target write retry "
                  f"{attempt + 1}/{max_attempts} after {delay}s"
              )
              time.sleep(delay)
          else:
              raise SystemExit(
                  "release target sync failed after retries: "
                  + str(last_error or "unknown")
              )
